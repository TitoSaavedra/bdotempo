[tools]
python = "3.12"

[env]
PYTHONPATH = "{{config_root}}/src"
PYTHONUTF8 = "1"

[tasks.install]
description = "Install the pinned Python dependencies (cryptography, brotli) from requirements.txt"
run = "python -m pip install --quiet -r requirements.txt"

[tasks.test]
description = "Run unit tests (synthetic fixtures only, no real game data)"
depends = ["install"]
run = "python -c \"print('no tests yet: the old suite was removed, new tests are being rewritten')\""

[tasks.check]
description = "Byte-compile sources and sanity-check the combo files"
run = [
  "python -m compileall -q src tests scripts",
  "python -c \"import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('combos').glob('*.json')]; print('combo files: valid JSON')\"",
]

[tasks.fetch-classhub]
description = "Download bdoclasshub.com class pages into data/classhub/ (pass --force to download again)"
run = "python scripts/fetch_classhub.py"

[tasks.import-guides]
description = "Read the saved class pages and the client export into data/combos/ and reports/unresolved_skills.txt"
run = "python -m bdo_combo.guides import"

[tasks.build-assets]
description = "Build the JSON staging bundle (data/asset-staging), then the asset parts in app/assets/parts (tracked in git)"
depends = ["import-guides", "install"]
run = [
  "python -m bdo_combo.guides bundle",
  "python -m bdo_combo.assetpack pack",
]

[tasks.pack-assets]
description = "Write the asset parts app/assets/parts/assets.partNN.bdoa from the client export and data/asset-staging (run build-assets first)"
depends = ["install"]
run = "python -m bdo_combo.assetpack pack"

[tasks.verify-assets]
description = "Check the committed asset parts: one set, every part present, every entry authenticated and hashed"
depends = ["install"]
run = "python -m bdo_combo.assetpack verify-parts app/assets/parts"

[tasks.validate]
description = "Cross-check the tamer awakening combo against class_skills.json"
run = "python -m bdo_combo validate --combo combos/tamer.awakening.json"

[tasks.list-characters]
description = "List characters of the detected (or --account) account, read-only"
run = "python -m bdo_combo list-characters"

[tasks.dry-run]
description = "Show the diff for the tamer awakening combo; writes nothing (pass --pcid X)"
run = "python -m bdo_combo apply --dry-run --combo combos/tamer.awakening.json"

[tasks.apply]
description = "Apply the tamer awakening combo (dry-run unless --write; pass --pcid X)"
run = "python -m bdo_combo apply --combo combos/tamer.awakening.json"

[tasks.backup]
description = "Back up gameVariable.xml of --pcid X or --all"
run = "python -m bdo_combo backup"

[tasks.list-backups]
description = "List backups with their manifest summary"
run = "python -m bdo_combo list-backups"

[tasks.restore]
description = "Restore a backup (pass --backup TIMESTAMP; dry-run unless --write)"
run = "python -m bdo_combo restore"
