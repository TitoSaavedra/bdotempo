[tools]
dotnet = "10.0.401"
python = "3.12"

[tasks.install-icon-deps]
description = "Install the pinned Python dependency of the icon script (resvg-py) from scripts/requirements-icon.txt"
run = "python -m pip install --quiet -r scripts/requirements-icon.txt"

[tasks.build-icon]
description = "Render assets/icon/app-icon.svg into app-icon.ico (7 PNG frames) and app-icon-<N>.png (deterministic, committed)"
depends = ["install-icon-deps"]
run = "python scripts/build_icon.py"

[tasks.restore]
description = "Restore NuGet packages for the app, the core and the tests"
run = [
  "dotnet restore src/BdoComboSetup/BdoComboSetup.csproj -p:Platform=x64",
  "dotnet restore tests/BdoComboSetup.Tests/BdoComboSetup.Tests.csproj",
]

[tasks.build]
description = "Build the WinUI app and the core (Debug, x64)"
run = "dotnet build src/BdoComboSetup/BdoComboSetup.csproj -c Debug -p:Platform=x64"

[tasks.run]
description = "Build and launch the app from the Debug output"
run = "dotnet run --project src/BdoComboSetup/BdoComboSetup.csproj -c Debug -p:Platform=x64"

[tasks.test]
description = "Run the xUnit tests for the core (view models, parsers, logger)"
run = "dotnet test tests/BdoComboSetup.Tests/BdoComboSetup.Tests.csproj"

[tasks.publish]
description = "Publish the framework-dependent win-x64 app (Release): needs the .NET 10 Desktop Runtime on the machine"
run = "dotnet publish src/BdoComboSetup/BdoComboSetup.csproj -c Release -r win-x64 -p:Platform=x64"

[tasks.package-installer]
description = "Build dist/BdoComboSetup-Setup-<version>.exe (Inno Setup 6 installer with the app and the asset parts) and dist/SHA256SUMS.txt. Needs Inno Setup 6 (see installer/README.md)"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Target installer"

[tasks.package-portable]
description = "Build dist/BdoComboSetup-Portable-<version>.zip (app + assets.bdoa + portable.flag, no installer) and dist/SHA256SUMS.txt"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Target portable"

[tasks.package]
description = "Build the installer and the portable zip into dist/ (git-ignored), with dist/SHA256SUMS.txt. Needs Inno Setup 6 (see installer/README.md)"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Target all"

[tasks.screenshots]
description = "Publish, then launch the exe once per image (demo data) and save only the app window (Apply, Preview per layout, hidden slots) to docs/screenshots (git-ignored)"
depends = ["publish"]
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/capture-screenshots.ps1"

[tasks.check]
description = "Build the app, then run the tests"
depends = ["build", "test"]
