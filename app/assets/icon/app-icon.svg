<?xml version="1.0" encoding="UTF-8"?>
<!-- BDO Combo Setup app icon. Original art, no game or publisher artwork.
     Source of truth for app-icon.ico and app-icon-*.png (generated by app/scripts/build_icon.py).
     Canvas 256x256. Groups with id "detail" are dropped for the small sizes (16, 24, 32 px). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a20"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>

  <!-- Windows 11 style tile: rounded square, corner radius about 22% of the size. -->
  <rect id="tile" x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#window)"/>
  <!-- Hairline edge in the border token: keeps the silhouette visible on dark backgrounds. -->
  <rect id="tile-edge" x="2" y="2" width="252" height="252" rx="54" ry="54" fill="none" stroke="#2b303a" stroke-width="4"/>

  <!-- Cooldown bar: three slots in the upper middle. The first one is filled and carries the gold. -->
  <g id="slots">
    <rect id="slot-1" x="36" y="66" width="52" height="52" rx="12" ry="12" fill="#d2b06a"/>
    <g id="detail">
      <rect id="slot-2" x="102" y="66" width="52" height="52" rx="12" ry="12" fill="none" stroke="#a3a8b3" stroke-width="5"/>
      <rect id="slot-3" x="168" y="66" width="52" height="52" rx="12" ry="12" fill="none" stroke="#2b303a" stroke-width="5"/>
    </g>
  </g>

  <!-- Combo chain: a bold gold arrow sweeping left to right under the slots. -->
  <g id="arrow" fill="none" stroke="#d2b06a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 52 176 H 182"/>
    <path d="M 164 158 L 186 176 L 164 194"/>
  </g>

  <!-- Four-point spark at the end of the arrow. -->
  <g id="detail-spark">
    <path d="M 222 132 Q 225 150 243 153 Q 225 156 222 174 Q 219 156 201 153 Q 219 150 222 132 Z" fill="#d2b06a"/>
  </g>
</svg>
